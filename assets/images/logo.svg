<svg width="480" height="200" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Learn Python logo</title>
  <desc>Two interlocked C-shapes inside a circle badge, with Learn Python text beside it</desc>

  <defs>
    <clipPath id="circle-clip">
      <circle cx="135" cy="135" r="118"/>
    </clipPath>
    <style>
      .label-dark { fill: #1A1A1A; }
      .tagline { fill: #888888; }
      @media (prefers-color-scheme: dark) {
        .label-dark { fill: #6FA8DC; }
        .tagline { fill: #9DC3E6; }
      }
    </style>
  </defs>

  <!-- Outer circle fill -->
  <circle cx="135" cy="135" r="118" fill="#F0F7FF"/>
  <circle cx="135" cy="135" r="118" fill="none" stroke="#3776AB" stroke-width="6"/>

  <!-- Inner yellow accent ring -->
  <circle cx="135" cy="135" r="108" fill="none" stroke="#FFD43B" stroke-width="3"/>

  <!-- C-shapes clipped inside circle -->
  <g clip-path="url(#circle-clip)">
    <path d="M 155,42 A 85,85 0 1,0 155,228" fill="none" stroke="#3776AB" stroke-width="38" stroke-linecap="round"/>
    <path d="M 115,228 A 85,85 0 1,0 115,42"  fill="none" stroke="#FFD43B" stroke-width="38" stroke-linecap="round"/>
  </g>

  <!-- Blue head dot -->
  <circle cx="155" cy="42"  r="11" fill="#3776AB"/>
  <circle cx="159" cy="39"  r="3.5" fill="white"/>
  <circle cx="160" cy="38"  r="1.8" fill="#1a1a1a"/>

  <!-- Yellow head dot -->
  <circle cx="115" cy="228" r="11" fill="#FFD43B"/>
  <circle cx="111" cy="225" r="3.5" fill="white"/>
  <circle cx="110" cy="224" r="1.8" fill="#1a1a1a"/>

  <!-- Outer circle border on top -->
  <circle cx="135" cy="135" r="118" fill="none" stroke="#3776AB" stroke-width="6"/>

  <!-- LEARN -->
  <text x="278" y="115"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="56" font-weight="300"
        letter-spacing="-1"
        class="label-dark">Learn</text>

  <!-- PYTHON -->
  <text x="276" y="187"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700"
        letter-spacing="-2"
        fill="#3776AB">Python</text>

  <!-- Yellow underline -->
  <rect x="278" y="200" width="380" height="6" rx="3" fill="#FFD43B"/>

  <!-- Tagline -->
  <text x="279" y="230"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="15" class="tagline"
        letter-spacing="0.4">Step-by-step · Basics to Advanced</text>
</svg>
